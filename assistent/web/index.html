</head>

  <!-- Sprache: kleines Menü, das am Knopf aufgeht -->
  <div class="sprache">
    <button type="button" id="sprache-knopf" class="druck" aria-haspopup="menu" aria-expanded="false" aria-controls="sprache-menue">
      <svg class="icon " aria-hidden="true"><use href="#i-sprache"/></svg><span id="sprache-name"></span><svg class="icon pfeil" aria-hidden="true"><use href="#i-pfeil"/></svg>
    </button>
    <div id="sprache-menue" role="menu" data-t-label="sprache" hidden>
      <button type="button" role="menuitemradio" data-sprache="de" lang="de"><span>Deutsch</span><svg class="icon " aria-hidden="true"><use href="#i-ok"/></svg></button>
      <button type="button" role="menuitemradio" data-sprache="zh" lang="zh-CN"><span>中文</span><svg class="icon " aria-hidden="true"><use href="#i-ok"/></svg></button>
    </div>
  </div>

  <!-- Anmelden: nur einmal pro Handy -->
  <section id="login" class="login" hidden>
    <div class="biko-platz" data-biko></div>
    <h1 data-t="login_titel"></h1>
    <p class="leise" data-t="login_text"></p>
    <form id="login-form">
      <label for="passwort" data-t="passwort"></label>
      <input id="passwort" type="password" autocomplete="current-password" required aria-describedby="login-fehler">
      <p id="login-fehler" class="meldung fehler" role="alert"></p>
      <button type="submit" class="knopf haupt druck" data-t="anmelden"></button>
    </form>
  </section>

  <main id="app" hidden>
    <div class="ansichten">
    <!-- 1. Reden und fragen -->
    <section class="ansicht" data-ansicht="reden">
      <header class="kopf gross" id="reden-kopf">
        <div class="biko-platz" data-biko="haupt" id="biko-reden"></div>
        <div>
          <h1 id="gruss"></h1>
          <p class="leise" data-t="reden_text"></p>
        </div>
      </header>
      <div id="vorschlaege" class="vorschlaege"></div>
      <div id="verlauf" class="verlauf" aria-live="polite"></div>
      <div class="eingabe-platz">
        <p id="chat-hinweis" class="meldung klein" role="status"></p>
        <form id="chat-form" class="eingabe">
          <textarea id="chat-text" rows="1" data-t-ph="eingabe" data-t-label="eingabe" enterkeyhint="send"></textarea>
          <button type="submit" id="chat-knopf" class="druck" data-art="mikro">
            <span class="wechsel"><svg class="icon i-mikro" aria-hidden="true"><use href="#i-mikro"/></svg><svg class="icon i-senden" aria-hidden="true"><use href="#i-senden"/></svg><svg class="icon i-stopp" aria-hidden="true"><use href="#i-stopp"/></svg></span>
          </button>
        </form>
      </div>
    </section>

    <!-- 2. Nachricht schreiben -->
    <section class="ansicht" data-ansicht="nachricht" hidden>
      <header class="kopf">
        <div class="biko-platz" data-biko></div>
        <div>
          <h1 data-t="nachricht_titel"></h1>
          <p class="leise" data-t="nachricht_text"></p>
        </div>
      </header>
      <form id="nachricht-form" class="karte reihe">
        <label for="nachricht-an" data-t="an_wen"></label>
        <input id="nachricht-an" type="text" aria-describedby="nachricht-an-hilfe" autocomplete="off">
        <p class="hilfe detail" id="nachricht-an-hilfe" data-t="an_wen_hilfe"></p>
        <label for="nachricht-was" data-t="was_sagen"></label>
        <textarea id="nachricht-was" rows="3" aria-describedby="nachricht-was-hilfe"></textarea>
        <p class="hilfe detail" id="nachricht-was-hilfe" data-t="was_sagen_hilfe"></p>
        <button type="submit" class="knopf haupt druck" id="nachricht-los"><svg class="icon " aria-hidden="true"><use href="#i-nachricht"/></svg><span data-t="schreiben"></span></button>
        <p id="nachricht-fehler" class="meldung fehler" role="alert"></p>
      </form>
      <div id="nachricht-ergebnis" class="karte" hidden>
        <h2 data-t="so_lautet"></h2>
        <p id="nachricht-text" class="nachricht-text"></p>
        <div class="zwei">
          <button type="button" id="nachricht-kopieren" class="knopf haupt druck" data-zustand="ruhe">
            <span class="wechsel"><svg class="icon i-ruhe" aria-hidden="true"><use href="#i-kopieren"/></svg><svg class="icon i-ok" aria-hidden="true"><use href="#i-ok"/></svg></span><span id="nachricht-kopieren-text"></span>
          </button>
          <button type="button" id="nachricht-teilen" class="knopf druck"><svg class="icon " aria-hidden="true"><use href="#i-teilen"/></svg><span data-t="teilen"></span></button>
        </div>
        <p id="nachricht-info" class="meldung" role="status"></p>
      </div>
    </section>

    <!-- 3. Erinnerungen -->
    <section class="ansicht" data-ansicht="erinnern" hidden>
      <header class="kopf">
        <div class="biko-platz" data-biko></div>
        <div>
          <h1 data-t="erinnern_titel"></h1>
          <p class="leise" data-t="erinnern_text"></p>
        </div>
      </header>
      <button type="button" id="erinnerung-neu" class="knopf haupt druck reihe"><svg class="icon " aria-hidden="true"><use href="#i-plus"/></svg><span data-t="neue_erinnerung"></span></button>
      <ul id="erinnerungen" class="liste" aria-live="polite"></ul>
      <button type="button" id="ton-test" class="knopf druck reihe"><svg class="icon " aria-hidden="true"><use href="#i-erinnern"/></svg><span data-t="ton_test"></span></button>
    </section>

    <!-- Einstellungen (für die Familie) -->
    <section class="ansicht" data-ansicht="einstellen" hidden>
      <header class="kopf">
        <div class="biko-platz" data-biko></div>
        <div>
          <h1 data-t="einstellen_titel"></h1>
          <p class="leise" data-t="einstellen_text"></p>
        </div>
      </header>
      <form id="profil-form" class="karte reihe">
        <label for="profil-name" data-t="name"></label>
        <input id="profil-name" type="text" maxlength="80" aria-describedby="profil-name-hilfe" autocomplete="off">
        <p class="hilfe detail" id="profil-name-hilfe" data-t="name_hilfe"></p>
        <label for="profil-anrede" data-t="anrede"></label>
        <select id="profil-anrede">
          <option value="du" data-t="anrede_du"></option>
          <option value="Sie" data-t="anrede_sie"></option>
        </select>
        <label for="profil-diaet" data-t="diaet"></label>
        <textarea id="profil-diaet" rows="3" aria-describedby="profil-diaet-hilfe"></textarea>
        <p class="hilfe detail" id="profil-diaet-hilfe" data-t="diaet_hilfe"></p>
        <label for="profil-notizen" data-t="notizen"></label>
        <textarea id="profil-notizen" rows="3" aria-describedby="profil-notizen-hilfe"></textarea>
        <p class="hilfe detail" id="profil-notizen-hilfe" data-t="notizen_hilfe"></p>
        <button type="submit" class="knopf haupt druck" id="profil-speichern" data-zustand="ruhe">
          <span class="wechsel"><svg class="icon i-ok" aria-hidden="true"><use href="#i-ok"/></svg></span><span id="profil-speichern-text"></span>
        </button>
        <p id="profil-info" class="meldung" role="status"></p>
      </form>
      <div class="karte reihe">
        <div class="schalter-zeile">
          <span id="vorlesen-text" data-t="vorlesen_immer"></span>
          <button type="button" id="vorlesen" class="schalter" role="switch" aria-checked="false" aria-labelledby="vorlesen-text">
            <span class="bahn"><span class="knauf"></span></span>
          </button>
        </div>
        <p class="label" id="schrift-text" data-t="schrift"></p>
        <div id="schrift" class="segment" role="group" aria-labelledby="schrift-text">
          <button type="button" data-wert="1" data-t="schrift_normal"></button>
          <button type="button" data-wert="1.15" data-t="schrift_gross"></button>
          <button type="button" data-wert="1.3" data-t="schrift_sehr_gross"></button>
          <div class="oben" aria-hidden="true">
            <span data-t="schrift_normal"></span><span data-t="schrift_gross"></span><span data-t="schrift_sehr_gross"></span>
          </div>
        </div>
      </div>
      <button type="button" id="verlauf-loeschen" class="knopf druck reihe" data-t="vergessen"></button>
      <p id="vergessen-info" class="meldung" role="status"></p>
      <p class="leise klein hinweis detail" data-t="hinweis"></p>
    </section>
    </div>

    <nav class="leiste" data-t-label="bereiche">
      <span class="leiste-kissen" aria-hidden="true"></span>
      <button type="button" data-ziel="reden" aria-current="page"><svg class="icon " aria-hidden="true"><use href="#i-reden"/></svg><span data-t="tab_reden"></span></button>
      <button type="button" data-ziel="nachricht"><svg class="icon " aria-hidden="true"><use href="#i-nachricht"/></svg><span data-t="tab_nachricht"></span></button>
      <button type="button" data-ziel="erinnern"><svg class="icon " aria-hidden="true"><use href="#i-erinnern"/></svg><span data-t="tab_erinnern"></span></button>
      <button type="button" data-ziel="einstellen"><svg class="icon " aria-hidden="true"><use href="#i-einstellen"/></svg><span data-t="tab_einstellen"></span></button>
    </nav>
  </main>

  <!-- Blatt: neue Erinnerung. Geht aus dem Plus-Knopf auf, lässt sich nach unten wegziehen. -->
  <dialog id="blatt" aria-labelledby="blatt-titel">
    <div class="blatt-inhalt">
      <div class="blatt-griff" aria-hidden="true"></div>
      <div class="blatt-kopf">
        <h2 id="blatt-titel" data-t="neue_erinnerung" tabindex="-1" autofocus></h2>
        <button type="button" id="blatt-zu" class="rund-klein druck" data-t-label="schliessen"><svg class="icon " aria-hidden="true"><use href="#i-zu"/></svg></button>
      </div>
      <form id="erinnerung-form">
        <label for="erinnerung-zeit" data-t="uhrzeit"></label>
        <input id="erinnerung-zeit" type="time" required value="08:00">
        <label for="erinnerung-text" data-t="woran"></label>
        <input id="erinnerung-text" type="text" required maxlength="120" aria-describedby="erinnerung-text-hilfe" autocomplete="off">
        <p class="hilfe" id="erinnerung-text-hilfe" data-t="woran_hilfe"></p>
        <fieldset>
          <legend data-t="welche_tage"></legend>
          <div class="tage" id="tage-wahl"></div>
        </fieldset>
        <p id="erinnerung-fehler" class="meldung fehler" role="alert"></p>
        <button type="submit" class="knopf haupt druck" data-t="speichern"></button>
      </form>
    </div>
  </dialog>

  <!-- Erinnerung, die gerade fällig ist: groß über allem, bis "Erledigt" gedrückt wird -->
  <div id="alarm" class="alarm" role="alertdialog" aria-labelledby="alarm-titel" aria-describedby="alarm-text" hidden>
    <div class="biko-platz" data-biko></div>
    <p class="alarm-titel" id="alarm-titel" data-t="erinnerung"></p>
    <p id="alarm-text" class="alarm-text"></p>
    <button type="button" id="alarm-ok" class="knopf haupt druck"><svg class="icon " aria-hidden="true"><use href="#i-ok"/></svg><span data-t="erledigt"></span></button>
    <button type="button" id="alarm-spaeter" class="knopf druck" data-t="spaeter"></button>
  </div>

  <script src="texte.js"></script>
  <script src="logik.js"></script>
  <script src="biko.js"></script>
  <script src="bewegung.js"></script>
  <script src="app.js"></script>
</body>
</html>
