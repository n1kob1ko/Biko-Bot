<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E8">
  <meta name="robots" content="noindex, nofollow">
  <title>Biko Helfer</title>
  <link rel="icon" href="biko.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Texte stehen in app.js (Deutsch und Chinesisch). data-t = Text, data-t-ph = Platzhalter. -->
  <button type="button" class="sprache-knopf" id="sprache-knopf" aria-label="Sprache wechseln">中文</button>

  <!-- Anmelden: nur einmal pro Handy -->
  <section id="login" class="login" hidden>
    <img src="biko.svg" alt="" class="biko gross">
    <h1 data-t="login_titel"></h1>
    <p data-t="login_text"></p>
    <form id="login-form">
      <label for="passwort" data-t="passwort"></label>
      <input id="passwort" type="password" autocomplete="current-password" required>
      <button type="submit" class="knopf haupt" data-t="anmelden"></button>
      <p id="login-fehler" class="fehler" role="alert"></p>
    </form>
  </section>

  <main id="app" hidden>
    <!-- Erinnerung, die gerade fällig ist: groß über allem, bis "Erledigt" gedrückt wird -->
    <div id="alarm" class="alarm" role="alertdialog" aria-live="assertive" hidden>
      <img src="biko.svg" alt="" class="biko wackelt">
      <p class="alarm-titel" data-t="erinnerung"></p>
      <p id="alarm-text" class="alarm-text"></p>
      <button type="button" id="alarm-ok" class="knopf haupt" data-t="erledigt"></button>
      <button type="button" id="alarm-spaeter" class="knopf" data-t="spaeter"></button>
    </div>

    <!-- 1. Reden und fragen -->
    <section class="ansicht" data-ansicht="reden">
      <header class="kopf">
        <img src="biko.svg" alt="" class="biko" id="biko-reden">
        <div>
          <h1 id="gruss"></h1>
          <p class="leise" data-t="reden_text"></p>
        </div>
      </header>
      <div id="vorschlaege" class="vorschlaege"></div>
      <div id="verlauf" class="verlauf" aria-live="polite"></div>
      <form id="chat-form" class="eingabe">
        <textarea id="chat-text" rows="2" data-t-ph="hier_schreiben" aria-label="Nachricht an Biko"></textarea>
        <div class="eingabe-knoepfe">
          <button type="button" class="knopf mikro" data-ziel="chat-text" data-t="sprechen"></button>
          <button type="submit" class="knopf haupt" data-t="senden"></button>
        </div>
      </form>
    </section>

    <!-- 2. Nachricht schreiben -->
    <section class="ansicht" data-ansicht="nachricht" hidden>
      <header class="kopf">
        <img src="biko.svg" alt="" class="biko">
        <div>
          <h1 data-t="nachricht_titel"></h1>
          <p class="leise" data-t="nachricht_text"></p>
        </div>
      </header>
      <form id="nachricht-form" class="karte">
        <label for="nachricht-an" data-t="an_wen"></label>
        <input id="nachricht-an" data-t-ph="an_wen_ph">
        <label for="nachricht-was" data-t="was_sagen"></label>
        <textarea id="nachricht-was" rows="3" data-t-ph="was_sagen_ph"></textarea>
        <div class="eingabe-knoepfe">
          <button type="button" class="knopf mikro" data-ziel="nachricht-was" data-t="sprechen"></button>
          <button type="submit" class="knopf haupt" data-t="schreiben"></button>
        </div>
      </form>
      <div id="nachricht-ergebnis" class="karte ergebnis" hidden>
        <p class="leise" data-t="so_lautet"></p>
        <p id="nachricht-text" class="nachricht-text"></p>
        <div class="eingabe-knoepfe">
          <button type="button" id="nachricht-kopieren" class="knopf haupt" data-t="kopieren"></button>
          <button type="button" id="nachricht-teilen" class="knopf" data-t="teilen"></button>
        </div>
        <p id="nachricht-info" class="leise" role="status"></p>
      </div>
    </section>

    <!-- 3. Erinnerungen -->
    <section class="ansicht" data-ansicht="erinnern" hidden>
      <header class="kopf">
        <img src="biko.svg" alt="" class="biko">
        <div>
          <h1 data-t="erinnern_titel"></h1>
          <p class="leise" data-t="erinnern_text"></p>
        </div>
      </header>
      <ul id="erinnerungen" class="liste"></ul>
      <form id="erinnerung-form" class="karte">
        <h2 data-t="neue_erinnerung"></h2>
        <label for="erinnerung-zeit" data-t="uhrzeit"></label>
        <input id="erinnerung-zeit" type="time" required value="08:00">
        <label for="erinnerung-text" data-t="woran"></label>
        <input id="erinnerung-text" required maxlength="120" data-t-ph="woran_ph">
        <fieldset class="tage" id="tage-wahl">
          <legend data-t="welche_tage"></legend>
        </fieldset>
        <button type="submit" class="knopf haupt" data-t="speichern"></button>
      </form>
      <button type="button" id="ton-test" class="knopf" data-t="ton_test"></button>
    </section>

    <!-- Einstellungen (für die Familie) -->
    <section class="ansicht" data-ansicht="einstellen" hidden>
      <header class="kopf">
        <img src="biko.svg" alt="" class="biko">
        <div>
          <h1 data-t="einstellen_titel"></h1>
          <p class="leise" data-t="einstellen_text"></p>
        </div>
      </header>
      <form id="profil-form" class="karte">
        <label for="profil-name" data-t="name"></label>
        <input id="profil-name" maxlength="80" data-t-ph="name_ph">
        <label for="profil-anrede" data-t="anrede"></label>
        <select id="profil-anrede">
          <option value="du" data-t="anrede_du"></option>
          <option value="Sie" data-t="anrede_sie"></option>
        </select>
        <label for="profil-diaet" data-t="diaet"></label>
        <textarea id="profil-diaet" rows="4" data-t-ph="diaet_ph"></textarea>
        <label for="profil-notizen" data-t="notizen"></label>
        <textarea id="profil-notizen" rows="4" data-t-ph="notizen_ph"></textarea>
        <label class="schalter"><input type="checkbox" id="vorlesen"> <span data-t="vorlesen_immer"></span></label>
        <label for="schrift" data-t="schrift"></label>
        <select id="schrift">
          <option value="1" data-t="schrift_normal"></option>
          <option value="1.15" data-t="schrift_gross"></option>
          <option value="1.3" data-t="schrift_sehr_gross"></option>
        </select>
        <button type="submit" class="knopf haupt" data-t="speichern"></button>
        <p id="profil-info" class="leise" role="status"></p>
      </form>
      <button type="button" id="verlauf-loeschen" class="knopf" data-t="vergessen"></button>
      <p class="leise klein" data-t="hinweis"></p>
    </section>

    <nav class="leiste" aria-label="Bereiche">
      <button type="button" data-ziel="reden" aria-current="page"><span aria-hidden="true">💬</span><b data-t="tab_reden"></b></button>
      <button type="button" data-ziel="nachricht"><span aria-hidden="true">✉️</span><b data-t="tab_nachricht"></b></button>
      <button type="button" data-ziel="erinnern"><span aria-hidden="true">⏰</span><b data-t="tab_erinnern"></b></button>
      <button type="button" data-ziel="einstellen"><span aria-hidden="true">⚙️</span><b data-t="tab_einstellen"></b></button>
    </nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
