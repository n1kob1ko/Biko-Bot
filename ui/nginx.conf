# Biko App: liefert die Oberfläche aus und leitet /api/ an den Freqtrade-Container weiter.
# So braucht die App kein CORS, und die Freqtrade-API muss nicht extra freigegeben werden.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker-DNS, damit nginx auch startet, wenn der Bot noch nicht läuft
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Anmelden und Token erneuern sind die einzigen POST-Aufrufe der App
    location ~ ^/api/v1/token/(login|refresh)$ {
        limit_except POST { deny all; }
        set $freqtrade http://freqtrade:8080;
        proxy_pass $freqtrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Eingreifen aus der App: Pause (stopentry/pause), Weiter (start), offenen Trade verkaufen (forceexit).
    # Von Hand kaufen (forceenter), Bot ganz stoppen, Trades löschen usw. bleiben gesperrt.
    location ~ ^/api/v1/(stopentry|pause|start|forceexit)$ {
        limit_except POST { deny all; }
        set $freqtrade http://freqtrade:8080;
        proxy_pass $freqtrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Einstellungen der Biko-App (Coins, Takt, Risiko, max. Trades)
    location = /settings-api/settings {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        set $settings http://biko-settings:8090;
        proxy_pass $settings;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Sonst nur lesen
    location /api/ {
        limit_except GET { deny all; }
        set $freqtrade http://freqtrade:8080;
        proxy_pass $freqtrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Sicherheits-Header (stehen im location-Block, weil nginx sie sonst nicht vererbt)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
}
