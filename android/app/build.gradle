plugins { id "com.android.application" }

android {
    namespace "at.biko.helfer"
    compileSdk 35
    defaultConfig {
        applicationId "at.biko.helfer"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.4"
        // Hier wohnt Biko. Für einen anderen Server einfach diese Adresse ändern.
        buildConfigField "String", "BIKO_ADRESSE", '"https://biko-helfer-production.up.railway.app/"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        // Fester Test-Schlüssel, damit sich neue Versionen über die alte installieren lassen.
        // Nur zum Testen: für den Play Store braucht es einen eigenen, geheimen Schlüssel.
        test {
            storeFile file("test-schluessel.jks")
            storePassword "biko-test"
            keyAlias "biko"
            keyPassword "biko-test"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
