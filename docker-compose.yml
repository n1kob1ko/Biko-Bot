# Biko Bot: Freqtrade – Kraken Spot, Trendfolge 4h
# Start (Dry-Run):  docker compose up -d
# Logs:             docker compose logs -f
services:
  freqtrade:
    # "stable" = letzte stabile Version. Für reproduzierbare Backtests auf eine
    # feste Version pinnen, z. B. freqtradeorg/freqtrade:2026.10
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: biko-bot
    env_file: .env            # Secrets nur hier, nie in config.json
    volumes:
      - "./user_data:/freqtrade/user_data"
    # FreqUI/REST-API nur lokal erreichbar. Auf dem VPS per SSH-Tunnel öffnen:
    #   ssh -L 8080:127.0.0.1:8080 user@vps
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/${BOT_CONFIG:-config.json}
      --strategy EmaTrendStrategy

  # Biko App: einfache Handy-Oberfläche mit Maskottchen (liest nur die API oben)
  # Öffnen: http://127.0.0.1:8081  (auf dem VPS per ssh -L 8081:127.0.0.1:8081 user@vps)
  biko-app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    container_name: biko-app
    depends_on:
      - freqtrade
    volumes:
      - "./ui/web:/usr/share/nginx/html:ro"
      - "./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "127.0.0.1:8081:80"
