# Baut die Android-App (Biko als Blase) und legt die APK zum Herunterladen bereit.
# Nach jedem Merge nach main: https://github.com/n1kob1ko/Biko-Bot/releases/download/android-test/biko-helfer.apk
name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk biko-helfer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: biko-helfer-apk
          path: android/biko-helfer.apk
      - name: Zum Herunterladen bereitstellen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Biko Helfer für Android (Test)
          prerelease: true
          make_latest: false
          files: android/biko-helfer.apk
          body: |
            Test-Version der Android-App: Biko als Blase über allen Apps.
            Auf dem Tablet diese Seite öffnen, biko-helfer.apk antippen und installieren.
            Anleitung: android/README.md im Repo.
